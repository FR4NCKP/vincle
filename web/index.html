<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F5F5F3">
  <title>Vincle</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap">
</head>
<body>

<!-- 01 Inicio y conexión -->
<section class="screen" id="connect" hidden>
  <svg class="blob blob-connect" aria-hidden="true" viewBox="0 0 200 200"><path d="M120,8C150,4,182,22,190,56C198,90,170,104,176,138C182,172,150,198,112,194C74,190,62,168,36,160C10,152,2,118,12,88C22,58,10,34,40,18C70,2,90,12,120,8Z"/></svg>
  <div class="dots dots-connect" aria-hidden="true"></div>

  <header class="bar">
    <span></span>
    <button class="icon-btn on-blob" data-open-settings aria-label="Ajustes">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <h1 class="wordmark">Vincle</h1>

  <div class="connect-body">
    <section class="block">
      <span class="eyebrow">Escanea el código QR</span>
      <button class="viewfinder" id="scan" type="button" aria-label="Activar la cámara para escanear el código QR">
        <video id="scan-video" playsinline muted hidden></video>
        <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
        <span class="scanline" aria-hidden="true"></span>
        <span class="viewfinder-hint" id="scan-hint">Toca para activar la cámara y apunta al código que muestra tu computadora</span>
      </button>
    </section>

    <div class="or" aria-hidden="true"><span></span><i>o</i><span></span></div>

    <form id="pin-form" class="block" novalidate>
      <fieldset>
        <legend class="eyebrow">Ingresa el código de 6 dígitos</legend>
        <div class="pin" id="pin">
          <input aria-label="Dígito 1" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          <input aria-label="Dígito 2" inputmode="numeric" maxlength="6">
          <input aria-label="Dígito 3" inputmode="numeric" maxlength="6">
          <input aria-label="Dígito 4" inputmode="numeric" maxlength="6">
          <input aria-label="Dígito 5" inputmode="numeric" maxlength="6">
          <input aria-label="Dígito 6" inputmode="numeric" maxlength="6">
        </div>
        <p class="note" id="connect-msg" role="status" aria-live="polite">Ambos aparecen al abrir Vincle en tu computadora.</p>
      </fieldset>
    </form>
  </div>

  <div class="footer">
    <button class="primary" type="submit" form="pin-form" id="connect-btn">
      <span>Conectar</span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<!-- 02 Trackpad -->
<section class="screen" id="pad" hidden>
  <svg class="blob blob-pad" aria-hidden="true" viewBox="0 0 200 200"><path d="M140.9,14.3C170.5,27.2,196.8,57.4,198.6,90.1C200.4,122.8,177.7,158,147.2,178.6C116.7,199.2,92,186,66,192C40,198,8,176,2,140C-4,104,20,92,22,62C24,32,42,14,66,8C90,2,111.3,1.4,140.9,14.3Z"/></svg>

  <header class="bar bar-pad">
    <span class="wordmark-small">Vincle</span>
    <div class="bar-right">
      <div class="status" data-status><span class="dot" aria-hidden="true"></span><span data-status-text>Conectando…</span></div>
      <button class="icon-btn" id="open-keys" aria-label="Abrir teclado">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M7 10h.5M11 10h.5M15 10h.5M8 14h8"/></svg>
      </button>
      <button class="icon-btn" data-open-settings aria-label="Ajustes">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="surface" id="surface" aria-label="Superficie del trackpad">
    <div class="dots dots-surface" aria-hidden="true"></div>
    <span class="corner-s tl" aria-hidden="true"></span><span class="corner-s tr" aria-hidden="true"></span>
    <span class="corner-s bl" aria-hidden="true"></span><span class="corner-s br" aria-hidden="true"></span>
    <div class="ring" id="ring" aria-hidden="true"><span></span></div>
    <p class="surface-hint">Un dedo mueve el cursor<br>Dos dedos desplazan<br>Mantén pulsado para arrastrar</p>
  </div>

  <div class="pad-buttons">
    <button class="primary-flat" id="click-left">Clic</button>
    <button class="outline" id="click-right">Clic derecho</button>
  </div>
</section>

<!-- 03 Teclado -->
<section class="screen" id="keys" hidden>
  <svg class="blob blob-keys" aria-hidden="true" viewBox="0 0 200 200"><path d="M163.1,25.7C186.4,44.8,191.6,84.2,183.4,116.9C175.2,149.6,153.6,175.6,124.3,189.8C95,204,72,190,50,176C28,162,-3,152,1.4,112C5.8,72,30,70,46,44C62,18,81.2,3,110,4C138.8,5,139.8,6.6,163.1,25.7Z"/></svg>

  <header class="bar bar-keys">
    <button class="icon-btn" id="close-keys" aria-label="Cerrar teclado">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="status" data-status><span class="dot" aria-hidden="true"></span><span data-status-text>Conectando…</span></div>
  </header>

  <div class="keys-body">
    <div class="sent" id="sent-block" hidden>
      <span class="eyebrow muted">Enviado</span>
      <p id="sent-text"></p>
    </div>
    <div class="writing">
      <label for="texto" class="eyebrow">Escribiendo</label>
      <textarea id="texto" rows="4" spellcheck="false" autocapitalize="sentences" placeholder="Escribe aquí"></textarea>
    </div>
    <div class="dots dots-keys" aria-hidden="true"></div>
  </div>

  <div class="keybar" id="keybar">
    <button data-key="esc">esc</button>
    <button data-key="tab">tab</button>
    <button id="ctrl" aria-pressed="false">ctrl</button>
    <button data-key="left" aria-label="Flecha izquierda"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button data-key="right" aria-label="Flecha derecha"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="send" id="send"><span>Enviar</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M19 5v7a2 2 0 0 1-2 2H6M10 10l-4 4 4 4"/></svg></button>
  </div>
</section>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <h2 id="settings-title">Ajustes</h2>
    <label class="eyebrow" for="sensitivity">Sensibilidad del cursor</label>
    <input type="range" id="sensitivity" min="0.4" max="3" step="0.1">
    <output id="sensitivity-out" for="sensitivity"></output>
    <button type="button" class="outline" id="disconnect">Desconectar</button>
    <button class="primary-flat">Listo</button>
  </form>
</dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
